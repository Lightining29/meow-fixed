version: '3.8'

services:
  # Spring Boot Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meow-web-app
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Defaults to local mongodb container if not configured in .env
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:-mongodb://mongodb:27017/food-deleivery}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Use Ollama running on the host machine
      - SPRING_AI_OLLAMA_BASE_URL=http://host.docker.internal:11434
    restart: always

  # MongoDB Service
  mongodb:
    image: mongo:6.0
    container_name: meow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
