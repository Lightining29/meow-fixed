<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OTP Verification</title>
  <style>
    :root{
      --bg1: #0f172a;
      --bg2: #071033;
      --card: rgba(255,255,255,0.06);
      --accent: linear-gradient(135deg,#7c3aed 0%,#06b6d4 100%);
      --glass: rgba(255,255,255,0.04);
      --muted: rgba(255,255,255,0.65);
      --success: #10b981;
      --danger: #ef4444;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }

    html,body{height:100%;}
    body{
      margin:0;
      min-height:100vh;
      background: radial-gradient(1200px 600px at 10% 20%, rgba(124,58,237,0.12), transparent 8%),
                  radial-gradient(1000px 500px at 90% 80%, rgba(6,182,212,0.08), transparent 8%),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      display:grid;
      place-items:center;
      color: #e6eef8;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:420px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:16px;
      padding:28px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(6px) saturate(120%);
    }

    .logo{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:6px;
    }
    .logo svg{width:44px;height:44px;flex:0 0 44px;border-radius:10px;padding:8px;background:linear-gradient(135deg,#0ea5e9, #7c3aed);}    
    h1{font-size:20px;margin:6px 0 0}
    p.lead{color:var(--muted);font-size:14px;margin-top:8px}

    .otp-row{display:flex;gap:8px;justify-content:center;margin:20px 0 8px}
    .otp-input{
      width:48px;height:64px;border-radius:10px;border:none;outline:none;
      background:var(--glass);
      color: #fff;font-size:28px;font-weight:600;text-align:center;
      box-shadow: inset 0 -6px 18px rgba(2,6,23,0.6);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .otp-input:focus{transform:translateY(-4px);box-shadow:0 10px 30px rgba(2,6,23,0.5);}

    .controls{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
    button.btn{
      background:var(--accent);
      -webkit-background-clip:text; background-clip:text; color: transparent;
      padding:10px 18px;border-radius:999px;border:1px solid transparent; cursor:pointer;
      font-weight:700;position:relative;overflow:hidden;
    }
    button.btn::before{
      content:'';position:absolute;inset:0;background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));border-radius:999px;z-index:-1;}

    .subtle{font-size:13px;color:var(--muted)}

    .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
    .submit{
      background:linear-gradient(90deg,#06b6d4,#7c3aed);border:none;padding:12px 14px;border-radius:12px;color:#051023;font-weight:800;cursor:pointer;font-size:15px;}

    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .timer{font-size:13px;color:var(--muted)}
    .resend{background:none;border:none;color: #9ad6df;cursor:pointer;font-weight:700}

    .status{height:18px;margin-top:6px;font-size:13px}
    .success{color:var(--success)}
    .error{color:var(--danger)}

    .footer{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}

    @media (max-width:420px){
      .otp-input{width:40px;height:56px;font-size:24px}
      .card{padding:20px}
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="6" fill="white" opacity="0.06"/><path d="M7 12h10M12 7v10" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.98"/></svg>
      <div>
        <h1>Verify your account</h1>
        <p class="lead">Enter the 4-digit code we sent to <strong th:text="${user.email}"></strong></p>
      </div>
    </div>

    <form  action="verify-otp" method="post" id="otpForm" autocomplete="off">
      <div class="otp-row" aria-hidden="false">
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input" id="d1" name="d1" aria-label="Digit 1" />
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input" id="d2" name="d2" aria-label="Digit 2" />
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input" id="d3" name="d3" aria-label="Digit 3" />
        <input inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-input" id="d4" name="d4" aria-label="Digit 4" />

      </div>

      <div class="meta">
        <div class="timer" id="timer">Resend code in <strong id="count">00:30</strong></div>
        <button type="button" id="resendBtn" class="resend" disabled>Resend</button>
      </div>

      <div class="status" id="status"></div>

      <div class="actions">
        <button class="submit" type="submit">Verify &nbsp;→</button>
      </div>

      <div class="footer">
        <div class="subtle">Didn't receive it? Check your spam folder or try another number.</div>
      </div>
    </form>
  </main>

  <script>
    // Grab inputs
    const inputs = Array.from(document.querySelectorAll('.otp-input'));
    const status = document.getElementById('status');
    const form = document.getElementById('otpForm');
    const resendBtn = document.getElementById('resendBtn');
    const countEl = document.getElementById('count');

    // Auto-focus first input
    inputs[0].focus();

    // helper to get OTP value
    function getOTP(){ return inputs.map(i => i.value).join(''); }

    // Move focus and handle keyboard
    inputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const v = e.target.value.replace(/[^0-9]/g,'');
        e.target.value = v;
        if(v && idx < inputs.length - 1) inputs[idx+1].focus();
      });

      input.addEventListener('keydown', (e) => {
        if(e.key === 'Backspace' && !e.target.value && idx > 0){
          inputs[idx-1].focus();
        }
        if(e.key === 'ArrowLeft' && idx > 0){ inputs[idx-1].focus(); }
        if(e.key === 'ArrowRight' && idx < inputs.length-1){ inputs[idx+1].focus(); }
      });

      // Allow pasting whole code
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text');
        const digits = paste.replace(/\D/g,'').slice(0, inputs.length).split('');
        digits.forEach((d,i) => inputs[i].value = d);
        const nextIndex = Math.min(digits.length, inputs.length-1);
        inputs[nextIndex].focus();
      });
    });

    // Simple fake verification (replace with your server call)
   
   
  

    // Resend timer
    document.getElementById("otpForm").addEventListener("submit", function(e) {
    const d1 = document.getElementById("d1").value;
    const d2 = document.getElementById("d2").value;
    const d3 = document.getElementById("d3").value;
    const d4 = document.getElementById("d4").value;

    const otp = d1 + d2 + d3 + d4;

    document.getElementById("finalOtp").value = otp;
});
   

    
    // small accessible enhancement: allow pressing Enter anywhere
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && document.activeElement.classList.contains('otp-input')){
        e.preventDefault();
        form.requestSubmit();
      }
    });

    // Optional: remove non-digit classes on change
    

    // CSS-inserted animation for shake (kept here so single-file)
    
  </script>
</body>
</html>
