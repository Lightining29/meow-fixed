<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - DineHaven</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f6f9fc, #e9f5ff);
      font-family: "Poppins", sans-serif;
    }

    .checkout-container {
      max-width: 1100px;
      margin: 50px auto;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
    }

    .form-section {
      flex: 1 1 60%;
      padding: 40px;
    }

    .summary-section {
      flex: 1 1 40%;
      background: linear-gradient(135deg, #56c4ff, #2f80ed);
      color: white;
      padding: 40px;
    }

    .btn-success {
      background: linear-gradient(135deg, #00b09b, #96c93d);
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 18px;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .checkout-container {
        margin: 15px !important;
      }
      .form-section, .summary-section {
        flex: 1 1 100% !important;
        padding: 25px !important;
      }
    }
  </style>
</head>

<body>
  <form action="payment" method="post">
    <div class="checkout-container">
      <!-- LEFT FORM SECTION -->
      <div class="form-section">
        <h2 class="mb-4 text-center">Checkout</h2>

        <input type="hidden" name="loginId" th:value="${user.id}">

        <!-- Customer Info -->
        <h5>Customer Information</h5>
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" th:value="${user.fname} + ' ' + ${user.lname}" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:value="${user.email}" readonly>
          </div>
        </div>

        <!-- Shipping Info -->
        <h5>Shipping Address</h5>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" th:value="${user.address}" required>
        </div>

        <!-- Payment Info -->
        <h5>Payment Method</h5>
        <div class="mb-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" id="creditCard" value="Card" checked>
            <label class="form-check-label" for="creditCard">Credit / Debit Card</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="payment" id="cod" value="COD">
            <label class="form-check-label" for="cod">Cash on Delivery</label>
          </div>
        </div>
        <input type="hidden" name="amount" th:value="${total}">
        <button type="submit" class="btn btn-success w-100 mt-3">Place Order</button>
      </div>

      <!-- RIGHT SUMMARY SECTION -->
      <div class="summary-section">
        <h4>Order Summary</h4>

        <div th:each="item : ${cartItems}" class="product-item d-flex justify-content-between mb-2">
          <span th:text="${item.product.food} + ' (x' + ${item.quantity} + ')'"></span>
          <strong th:text="${ '₹' + item.product.price * item.quantity}"></strong>
        </div>

        <div class="total-line d-flex justify-content-between mt-3 border-top pt-2">
          <span>Total</span>
          <span th:text="${ '₹' + total}"></span>
        </div>

        <p class="mt-4 small">Free shipping on orders above ₹1000. Orders usually arrive within 3–5 business days.</p>
      </div>
    </div>
  </form>
</body>

</html>
