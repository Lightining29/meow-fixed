<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .qr-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .qr-image {
            border: 3px solid #eee;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }
        .amount-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>
<body class="bg-light">

<div class="container">
    <div class="qr-container bg-white text-center">
        <h3 class="mb-4">Scan QR Code to Pay</h3>
        
        <p class="text-muted mb-4">Order ID: <span th:text="${orderId}"></span></p>
        
        <div class="amount-display mb-4">
            ₹ <span th:text="${#numbers.formatDecimal(amount, 1, 'COMMA', 2, 'POINT')}"></span>
        </div>

        <div class="mb-4">
            <img th:src="'data:image/png;base64,' + ${qrCodeBase64}" 
                 alt="Payment QR Code" 
                 class="qr-image"
                 width="300" 
                 height="300">
        </div>

        <p class="text-muted mb-4">Works with Google Pay, PhonePe, Paytm, BHIM & all UPI apps</p>

        <div class="card bg-light mb-4">
            <div class="card-body">
                <form th:action="@{/payment/verify}" method="post">
                    <input type="hidden" name="orderId" th:value="${orderId}">
                    <input type="hidden" name="amount" th:value="${amount}">
                    
                    <div class="mb-3">
                        <label class="form-label">Enter UTR / Transaction ID after payment</label>
                        <input type="text" class="form-control" name="utr" placeholder="Enter transaction reference number" required>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100">✅ I have made payment</button>
                </form>
            </div>
        </div>

        <div class="text-start">
            <h6>Instructions:</h6>
            <ol class="text-muted small">
                <li>Open any UPI payment app on your phone</li>
                <li>Scan this QR code</li>
                <li>Verify amount and merchant details</li>
                <li>Complete the payment</li>
                <li>Enter the transaction ID above and submit</li>
            </ol>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
